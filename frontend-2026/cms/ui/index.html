<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>編集室｜BonZuttner</title><link rel="stylesheet" href="./editor.css"><script defer src="./editor.js"></script></head><body>
<header><img src="/assets/bonzuttner-logo.png" alt="BonZuttner"><span>編集室</span><button type="button" id="logout">ログアウト</button></header>
<main><div class="intro"><div><p class="kicker">BONZUTTNER JOURNAL</p><h1>編集室<span>。</span></h1></div><p>下書きはチームで共有されます。<br>公開・取り下げは、選択中の言語だけに反映されます。</p></div>
<div class="desk"><aside><h2>原稿一覧</h2><div class="new"><button id="news">＋ お知らせを書く</button><button id="job">＋ 募集を作る</button></div><ul id="drafts"></ul><p id="empty">保存した原稿がここに並びます。</p></aside>
<section class="workspace"><div class="bar"><b id="kind">お知らせ</b><div role="group" aria-label="原稿の言語"><button id="ja" aria-pressed="true">日本語</button><button id="en" aria-pressed="false">English</button></div></div>
<form id="editor"><label><span id="titleLabel">タイトル</span><input id="title" maxlength="200"></label>
<div id="newsFields"><label>カテゴリー<input id="category" placeholder="例：会社からのお知らせ"></label><label>見出し画像 <small>任意・JPEG / PNG / WebP、500 KBまで</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="imageTools" hidden><img id="thumb" alt="選択中の画像"><button type="button" id="remove">画像を外す</button><label>画像の説明<input id="alt"></label></div></div>
<div id="jobFields" hidden><div class="pair"><label>勤務地<input id="location"></label><label>雇用形態<input id="employment"></label></div></div>
<label><span id="summaryLabel">一覧に載せる紹介文</span><textarea id="summary" rows="2"></textarea></label>
<label><span id="bodyLabel">本文</span><textarea id="body" rows="7"></textarea></label>
<div id="extra" hidden><label>応募条件<textarea id="requirements" rows="3"></textarea></label><label>応募先URL <small>任意</small><input type="url" id="apply" placeholder="https://"></label></div>
<div class="actions"><button type="submit" class="primary">下書き保存</button><button type="button" id="preview">プレビューを見る ↗</button></div></form>
<div class="actions"><button type="button" id="publish" hidden>この言語で公開する</button><button type="button" id="withdraw" hidden>掲載を取り下げる</button></div><p role="status" id="status"></p></section></div></main>
<dialog id="paper"><div class="dialogbar"><b>掲載イメージ</b><button id="close" autofocus>編集に戻る ×</button></div><article id="sheet"></article></dialog></body></html>
